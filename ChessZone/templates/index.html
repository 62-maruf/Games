<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Play chess online, against the computer, or face to face on one device.">
<title>ChessZone – Play Chess</title>
<link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ asset('favicon.ico') }}" sizes="32x32">
<link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">
<link rel="manifest" href="{{ asset('manifest.webmanifest') }}">
<link rel="stylesheet" href="{{ asset('style.css') }}">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js"></script>
<script defer src="{{ asset('sound.js') }}"></script>
<script defer src="{{ asset('app.js') }}"></script>
</head>
<body>
{% include "_pieces.svg" %}

<main id="menu" class="screen">
  <button class="icon-btn" data-settings aria-label="Settings" title="Settings"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
  <section class="panel">
    <img src="{{ asset('logo.svg') }}" alt="" width="72" height="72">
    <h1>ChessZone</h1>
    <p class="muted">Play chess with anyone, anywhere.</p>

    <input id="name" maxlength="14" placeholder="Your name" autocomplete="off" aria-label="Your name">
    <button class="btn primary" id="bOnline">Play online</button>
    <p class="muted small" id="lobbyInfo">Connecting…</p>

    <hr>
    <div class="row">
      <select id="level" aria-label="Computer level"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
      <select id="color" aria-label="Your colour"><option value="random">Random colour</option><option value="w">Play White</option><option value="b">Play Black</option></select>
    </div>
    <button class="btn" id="bBot">Play the computer</button>

    <hr>
    <button class="btn" id="bLocal">Face to face</button>
    <p class="muted small">Two players, one device.</p>
  </section>
</main>

<main id="game" class="screen" hidden>
  <div id="stage">
    <div class="pcard" id="topCard"></div>
    <div class="frame">
      <div id="board" role="grid" aria-label="Chess board"></div>
      <div class="coords files" id="files"></div>
      <div class="coords ranks" id="ranks"></div>
    </div>
    <div class="pcard" id="botCard"></div>
  </div>
  <aside id="side">
    <div id="statusRow">
      <div class="pill" id="status" role="status" aria-live="polite"></div>
      <button class="icon-btn" data-settings aria-label="Settings" title="Settings"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
    </div>
    <div class="pill" id="moves" aria-label="Moves"></div>
    <div id="actions">
      <button class="btn" id="bDraw">Offer draw</button>
      <button class="btn" id="bResign">Resign</button>
      <button class="btn" id="bFlip">Flip board</button>
      <button class="btn" id="bRematch">Rematch</button>
      <button class="btn" id="bLeave">Menu</button>
    </div>
    <select id="layout" aria-label="Face to face layout" hidden>
      <option value="face">Face to face: black pieces upside-down</option>
      <option value="flip">Pass &amp; play: board flips each turn</option>
    </select>
  </aside>
</main>

<dialog id="wait">
  <h2>Looking for an opponent…</h2>
  <div class="bar"><i id="waitBar"></i></div>
  <p class="muted" id="waitText"></p>
  <button class="btn" id="bCancel1">Cancel</button>
</dialog>

<dialog id="noopp">
  <h2>No opponent found</h2>
  <p class="muted">Nobody else is online right now. Play the computer instead?</p>
  <div class="row"><button class="btn" data-bot="easy">Easy</button><button class="btn" data-bot="medium">Medium</button><button class="btn" data-bot="hard">Hard</button></div>
  <div class="row"><button class="btn" id="bKeep">Keep waiting</button><button class="btn" id="bCancel2">Cancel</button></div>
</dialog>

<dialog id="promo"><h2>Promote to</h2><div class="promo" id="promoBtns"></div></dialog>

<dialog id="drawq">
  <h2 id="drawText"></h2>
  <div class="row"><button class="btn primary" id="bAcceptDraw">Accept</button><button class="btn" id="bDeclineDraw">Decline</button></div>
</dialog>

<dialog id="over">
  <h2 id="overTitle"></h2>
  <p class="muted" id="overText"></p>
  <div class="row"><button class="btn primary" id="bOverRematch">Rematch</button><button class="btn" id="bOverMenu">Menu</button></div>
  <button class="btn" id="bOverView">View board</button>
</dialog>

<dialog id="settings">
  <h2>Settings</h2>
  <h3>Board</h3>
    <label class="opt"><span class="grow"><b>Move suggestions</b><small>Dots show where the selected piece can go</small></span><input type="checkbox" class="switch" data-set="hints"></label>
    <label class="opt"><span class="grow"><b>Highlight last move</b></span><input type="checkbox" class="switch" data-set="lastMove"></label>
    <label class="opt"><span class="grow"><b>Show coordinates</b><small>Letters and numbers around the board</small></span><input type="checkbox" class="switch" data-set="coords"></label>
  <h3>Audio</h3>
    <label class="opt"><span class="grow"><b>Sound effects</b><small>Piece moves, captures, check and game end</small><input type="range" min="0" max="1" step="0.05" data-set="soundVol" aria-label="Sound effects volume"></span><input type="checkbox" class="switch" data-set="sound"></label>
    <label class="opt"><span class="grow"><b>Music</b><small>Calm background music</small><input type="range" min="0" max="1" step="0.05" data-set="musicVol" aria-label="Music volume"></span><input type="checkbox" class="switch" data-set="music"></label>
  <button class="btn primary" id="bCloseSettings">Done</button>
</dialog>

<div id="toast" role="status"></div>
</body>
</html>
